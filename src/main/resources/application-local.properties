# --- Local profile: H2, in-memory ---
# No external database needed. Data is wiped every time the app restarts,
# which is fine for now since we have no data worth keeping yet.
spring.datasource.url=jdbc:h2:mem:recruitment_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Web-based console at /h2-console for inspecting the in-memory tables
# while the app is running - useful while learning, not something you'd
# enable in a real deployment.
spring.h2.console.enabled=true

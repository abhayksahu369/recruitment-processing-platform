# --- Postgres profile: real PostgreSQL (see docker-compose.yml) ---
# Activate with: --spring.profiles.active=postgres (or SPRING_PROFILES_ACTIVE=postgres)
# Nothing outside this file changes when you switch to it - entities,
# repositories and services only ever depend on Spring's DataSource
# abstraction, never on H2 or PostgreSQL directly.
spring.datasource.url=jdbc:postgresql://localhost:5432/recruitment_db
spring.datasource.username=recruitment
spring.datasource.password=recruitment

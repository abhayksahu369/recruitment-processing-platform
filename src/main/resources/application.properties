spring.application.name=RecruitmentProcessingPlatform

# Which application-<profile>.properties file supplies the datasource.
# "local" (H2, in-memory) is active by default so the app runs with zero
# external setup. Switching to real PostgreSQL later is a config change only:
# run with --spring.profiles.active=postgres (see application-postgres.properties).
# No Java code - entities, repositories, services - changes either way, because
# they talk to Spring Data JPA's DataSource abstraction, never to a specific
# database driver.
spring.profiles.active=local

# --- JPA / Hibernate (shared by every profile) ---
# "update" lets Hibernate create/alter tables from our @Entity classes
# automatically. Convenient while we're actively designing the schema in
# Step 2, but it's a dev-only setting: a real production system would use a
# migration tool (Flyway/Liquibase) and set this to "validate" instead, so
# schema changes are explicit, reviewed, and repeatable.
spring.jpa.hibernate.ddl-auto=update

# Logs the SQL Hibernate actually generates. Turned on for now because we're
# learning - seeing the generated SQL is how you build intuition for what
# JPA is doing under the hood. Worth turning off (or down to debug) later.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- File upload ---
# Spring Boot's defaults (1MB per file, 10MB per request) are fine for a
# handful of test rows but nowhere near enough for the "hundreds of
# thousands of candidates" scale this system is meant for (see Step 9's
# benchmarks) - a 100k-row spreadsheet is comfortably larger than 1MB.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Kafka ---
# Where the broker lives. Only matters when actually running the app
# against a real broker (see docker-compose.yml) - tests override this
# with an embedded, in-process broker via @EmbeddedKafka instead.
spring.kafka.bootstrap-servers=localhost:9092

# Messages are JSON-serialized CandidateProcessingEvent records. The key
# is a plain candidateId string (see CandidateEventProducer for why it's
# the key), so a plain StringSerializer is enough on that side.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# JsonSerializer adds a header naming the exact Java class it serialized,
# by default - useful when producer and consumer are different
# applications that might not agree on package names. Here they're the
# same application, so the consumer already knows the type to expect
# (Step 7); the header would just be unused bytes on every message.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# The consumer side of the same contract (Step 7). Without this, Spring
# Boot defaults the consumer's value-deserializer to plain
# StringDeserializer - @KafkaListener then receives a raw JSON String and
# has no way to turn it into a CandidateProcessingEvent, failing every
# single message with MessageConversionException. Since the producer
# doesn't send type headers (above), value.default.type tells
# JsonDeserializer exactly what class to deserialize into instead of
# reading that from a header that was never written.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.recruitment.dto.CandidateProcessingEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

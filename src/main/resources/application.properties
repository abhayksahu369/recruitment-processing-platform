spring.application.name=RecruitmentProcessingPlatform

# Which application-<profile>.properties file supplies the datasource.
# "local" (H2, in-memory) is active by default so the app runs with zero
# external setup. Switching to real PostgreSQL later is a config change only:
# run with --spring.profiles.active=postgres (see application-postgres.properties).
# No Java code - entities, repositories, services - changes either way, because
# they talk to Spring Data JPA's DataSource abstraction, never to a specific
# database driver.
spring.profiles.active=local

# --- JPA / Hibernate (shared by every profile) ---
# "update" lets Hibernate create/alter tables from our @Entity classes
# automatically. Convenient while we're actively designing the schema in
# Step 2, but it's a dev-only setting: a real production system would use a
# migration tool (Flyway/Liquibase) and set this to "validate" instead, so
# schema changes are explicit, reviewed, and repeatable.
spring.jpa.hibernate.ddl-auto=update

# Logs the SQL Hibernate actually generates. Turned on for now because we're
# learning - seeing the generated SQL is how you build intuition for what
# JPA is doing under the hood. Worth turning off (or down to debug) later.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- File upload ---
# Spring Boot's defaults (1MB per file, 10MB per request) are fine for a
# handful of test rows but nowhere near enough for the "hundreds of
# thousands of candidates" scale this system is meant for (see Step 9's
# benchmarks) - a 100k-row spreadsheet is comfortably larger than 1MB.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
